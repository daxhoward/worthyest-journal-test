<Sec s={1} e="☀️" l="MORNING" sub1="Step 1 of 3" sub2="Check in & set your intentions"/>

<div style={{background:c.g,borderRadius:18,padding:"22px 16px",marginBottom:12,textAlign:"center"}}><p style={{fontFamily:"'Merriweather',serif",fontSize:22,fontWeight:700,color:c.t,marginBottom:2}}>Last Night's Sleep</p><p style={{fontSize:14,color:c.a,fontWeight:600,marginBottom:12}}>How many hours of sleep did you get last night?</p><span style={{fontSize:28}}>😴</span><div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,marginTop:8}}><button onClick={()=>setSleep(s=>Math.max(0,s-0.5))} style={{width:36,height:36,borderRadius:10,border:`2px solid ${c.b}`,background:"#fff",fontSize:20,color:c.a,cursor:"pointer",fontWeight:700}}>−</button><div><p style={{fontFamily:"'Merriweather',serif",fontSize:36,fontWeight:400,color:c.t}}>{sleep}</p><p style={{fontSize:13,color:c.t,opacity:0.65}}>hours</p></div><button onClick={()=>setSleep(s=>Math.min(12,s+0.5))} style={{width:36,height:36,borderRadius:10,border:`2px solid ${c.b}`,background:"#fff",fontSize:20,color:c.a,cursor:"pointer",fontWeight:700}}>+</button></div><p style={{fontSize:13,color:c.a,fontWeight:600,marginTop:8}}>avg: 6.8</p><div style={{marginTop:14,paddingTop:14,borderTop:`1.5px solid ${c.b}`}}><p style={{fontSize:15,color:c.t,fontWeight:600,lineHeight:1.5}}>Your sleep sets the tone for everything today — your energy, your mood, your clarity.</p></div></div>

<div style={{background:"#fff",borderRadius:18,padding:"22px 20px 18px",marginBottom:12,boxShadow:`0 4px 20px ${c.b}60`}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:8}}>Today's Intention</p><p style={{fontSize:17,color:c.t,lineHeight:1.5,fontWeight:500,marginBottom:16}}>If one thing could make today feel meaningful, what would it be?</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:"transparent",border:"none",borderBottom:`2px solid ${c.b}`,padding:"8px 0 10px",resize:"none",lineHeight:1.6}} placeholder="Just a sentence is enough..." rows={2}/></div>

{/* Morning Pages */}
<div style={{background:c.g,borderRadius:18,padding:"22px 20px 18px",marginBottom:12,border:`1.5px solid ${c.b}`}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:4}}>Morning Pages</p><p style={{fontSize:15,color:c.t,opacity:0.75,marginBottom:14}}>What's on your mind as you start today? No structure, no rules — just clear the clutter before the day begins.</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:"#fff",border:`1.5px solid ${c.b}`,borderRadius:12,padding:"14px",resize:"none",lineHeight:1.7}} placeholder="Whatever's swirling around in there..." rows={5}/></div>

<div style={{background:c.g,borderRadius:18,padding:"20px 18px",marginBottom:12,border:`1.5px solid ${c.b}`}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:4}}>Morning Ritual</p><p style={{fontSize:15,color:c.t,fontWeight:500,marginBottom:14}}>Start a guided practice or log what you've already done.</p>

{guidedRit!==null?(
<div style={{background:"#fff",borderRadius:16,padding:"24px 18px",marginBottom:10,border:`1.5px solid ${c.b}`,textAlign:"center"}}>
{guidedDone?(<div><p style={{fontSize:40,marginBottom:12}}>✨</p><p style={{fontFamily:"'Merriweather',serif",fontSize:20,fontWeight:700,color:c.t,marginBottom:6}}>Well done.</p><p style={{fontSize:14,color:c.t,opacity:0.7,marginBottom:20}}>Take a moment to notice how you feel.</p><button onClick={()=>{setRit(p=>p.includes(guidedRit)?p:[...p,guidedRit]);setGuidedRit(null);setGuidedDone(false);}} style={{padding:"12px 28px",borderRadius:12,border:"none",background:c.h,color:"#fff",fontSize:15,fontWeight:700,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>Back to Journal ✓</button></div>):(
<div><p style={{fontSize:40,marginBottom:12}}>{Ri[guidedRit][0]}</p><p style={{fontFamily:"'Merriweather',serif",fontSize:20,fontWeight:700,color:c.t,marginBottom:6}}>{Ri[guidedRit][1]}</p><p style={{fontSize:14,color:c.t,opacity:0.7,marginBottom:20}}>{guidedRit===0?"A guided breathing exercise. Under 2 minutes.":guidedRit===1?"A simple 5-move morning stretch. Under 2 minutes.":"A quiet moment with a visual anchor."}</p>
<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:160,marginBottom:20}}><div style={{width:120,height:120,borderRadius:"50%",background:c.h,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 40px ${c.a}30`,position:"relative",overflow:"hidden"}}><div style={{position:"absolute",inset:0,background:"radial-gradient(circle at 40% 35%,rgba(255,255,255,0.25),transparent 60%)"}}/><p style={{fontFamily:"'Merriweather',serif",fontSize:28,fontWeight:700,color:"#fff",position:"relative"}}>4</p></div></div>
<p style={{fontSize:13,color:c.t,opacity:0.5,marginBottom:20}}>This is a preview — full animation in production</p>
<button onClick={()=>setGuidedDone(true)} style={{padding:"14px 36px",borderRadius:12,border:"none",background:c.h,color:"#fff",fontSize:15,fontWeight:700,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>Complete Session</button>
<p onClick={()=>{setRit(p=>p.includes(guidedRit)?p:[...p,guidedRit]);setGuidedRit(null);setGuidedDone(false);}} style={{marginTop:12,fontSize:13,color:c.a,opacity:0.5,cursor:"pointer",fontWeight:500}}>Just log it instead</p>
</div>)}
</div>
):(
<div>
<div style={{display:"flex",gap:8,marginBottom:14}}>
<div style={{flex:1,display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"linear-gradient(135deg,#FFF8F2,#FDECDC)",borderRadius:10,border:`1.5px solid ${c.b}`}}><span style={{fontSize:14,color:c.a,fontWeight:700}}>▶</span><div><p style={{fontSize:13,fontWeight:700,color:c.a}}>Guided</p><p style={{fontSize:10,color:c.t,opacity:0.6}}>Opens an exercise</p></div></div>
<div style={{flex:1,display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"#fff",borderRadius:10,border:`1.5px solid ${c.b}`}}><span style={{fontSize:14,color:c.t,opacity:0.4}}>☐</span><div><p style={{fontSize:13,fontWeight:700,color:c.t}}>Log</p><p style={{fontSize:10,color:c.t,opacity:0.6}}>Tap to check off</p></div></div>
</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{Ri.map(([em,la,guided],i)=><div key={i} onClick={()=>{if(guided&&!rit.includes(i)){setGuidedRit(i);setGuidedDone(false);}else{setRit(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]);}}} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:12,cursor:"pointer",background:rit.includes(i)?`${c.a}12`:"#fff",border:rit.includes(i)?`2px solid ${c.a}`:`1.5px solid ${c.b}`,position:"relative"}}><span style={{fontSize:18}}>{em}</span><div style={{flex:1}}><span style={{fontSize:13,fontWeight:rit.includes(i)?600:500,color:rit.includes(i)?c.a:c.t,display:"block"}}>{la}</span>{guided&&!rit.includes(i)&&<span style={{fontSize:10,color:c.a,fontWeight:600}}>▶ guided</span>}</div>{rit.includes(i)&&<div style={{width:18,height:18,borderRadius:5,background:c.a,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:10}}>✓</span></div>}</div>)}</div>
</div>)}

<div onClick={()=>setSo(true)} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",background:so?`${c.a}08`:"#fff",borderRadius:12,border:so?`2px solid ${c.a}`:`1.5px solid ${c.b}`,marginTop:8,cursor:"pointer"}}><span style={{fontSize:18}}>✏️</span>{so?<input autoFocus value={ot} onChange={e=>setOt(e.target.value)} placeholder="What else did you do?" style={{flex:1,fontFamily:"'DM Sans'",fontSize:14,fontWeight:500,color:c.t,background:"transparent",border:"none",outline:"none"}}/>:<span style={{fontSize:13,fontWeight:500,color:`${c.a}80`}}>Something else...</span>}</div>

{rit.length>0&&<div style={{textAlign:"center",marginTop:12,padding:"12px 16px",background:"linear-gradient(135deg,#FFF8F2,#FDECDC)",borderRadius:12,border:`1.5px solid ${c.b}`}}><p style={{fontSize:14,color:c.a,fontWeight:600}}>{rit.length} ritual{rit.length>1?"s":""} logged this morning ✓</p></div>}
</div>

<div style={{background:"#fff",borderRadius:18,padding:"22px 20px 18px",marginBottom:12,border:`1.5px solid ${c.b}`}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><div style={{width:4,height:16,borderRadius:2,background:c.a}}/><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase"}}>The Conscious Plate</p></div><p style={{fontSize:15,color:c.t,lineHeight:1.5,opacity:0.75,marginBottom:12}}>A daily moment to notice how food shows up in your life — what you eat, how you eat, why you eat, and what it tells you about yourself.</p><p style={{fontSize:17,color:c.t,lineHeight:1.5,fontWeight:500,marginBottom:16}}>{c.pl}</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:"transparent",border:"none",borderBottom:`2px solid ${c.b}`,padding:"8px 0 10px",resize:"none",lineHeight:1.6}} placeholder="Whatever comes to mind..." rows={2}/></div>

<div style={{textAlign:"center",padding:"16px 20px",margin:"12px 0",background:c.g,borderRadius:16,border:`1.5px solid ${c.b}`}}><span style={{fontSize:32}}>🌤️</span><p style={{fontFamily:"'Merriweather',serif",fontSize:18,fontWeight:700,color:c.t,marginTop:8,marginBottom:4}}>See you at lunch?</p><p style={{fontSize:15,color:c.a,fontWeight:600}}>A quick 1-minute check-in is waiting for you.</p></div>

<Sec s={2} e="🌤️" l="MIDDAY" sub1="Step 2 of 3" sub2="Quick check-in"/>
<div style={{background:c.g,borderRadius:18,padding:"20px 20px",marginBottom:12,border:`1.5px solid ${c.b}`}}><p style={{fontFamily:"'Merriweather',serif",fontSize:18,fontWeight:400,fontStyle:"italic",color:c.t,lineHeight:1.5,marginBottom:16}}>Hey — halfway through. Take a breath. You're doing better than you think.</p><div style={{borderTop:`1.5px solid ${c.b}`,paddingTop:14}}><p style={{fontSize:15,color:c.t,fontWeight:500,marginBottom:12}}>How's your energy right now?</p><MR v={mm} set={setMm}/></div></div>
<p style={{fontSize:15,color:c.t,fontWeight:600,marginBottom:10}}>Update as you go — tap to add</p>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>{[["💧","Water","glasses","avg: 5.2",water,setWater,1,20],["🏃‍♀️","Movement","minutes","avg: 22",move,setMove,15,120]].map(([em,la,un,av,val,set,step,max])=><div key={la} style={{background:"#fff",borderRadius:18,padding:"18px 12px",textAlign:"center",border:`1.5px solid ${c.b}`}}><span style={{fontSize:26}}>{em}</span><p style={{fontSize:10,letterSpacing:2,fontWeight:700,color:c.a,marginTop:6,textTransform:"uppercase"}}>{la}</p><div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginTop:4}}><button onClick={()=>set(s=>Math.max(0,s-step))} style={{width:30,height:30,borderRadius:8,border:`2px solid ${c.b}`,background:"#fff",fontSize:18,color:c.a,cursor:"pointer",fontWeight:700}}>−</button><div><p style={{fontFamily:"'Merriweather',serif",fontSize:32,fontWeight:400,color:c.t}}>{val}</p><p style={{fontSize:13,color:c.t,opacity:0.65}}>{un}</p></div><button onClick={()=>set(s=>Math.min(max,s+step))} style={{width:30,height:30,borderRadius:8,border:`2px solid ${c.b}`,background:"#fff",fontSize:18,color:c.a,cursor:"pointer",fontWeight:700}}>+</button></div><p style={{fontSize:13,color:c.a,fontWeight:600,marginTop:8}}>{av}</p></div>)}</div>

<Sec s={3} e="🌙" l="EVENING" sub1="Step 3 of 3" sub2="Reflect & close your day"/>
<div style={{textAlign:"center",padding:"8px 16px 16px"}}><p style={{fontSize:16,color:c.t,lineHeight:1.6,fontWeight:500}}>Another day in the books. Let's take a quiet look back.</p></div>

<div style={{background:"#fff",borderRadius:18,padding:"20px 16px",marginBottom:12,border:`1.5px solid ${c.b}`}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.t,textTransform:"uppercase",marginBottom:4}}>Energy & Mood</p>{mm!==null&&<p style={{fontSize:14,color:c.a,fontWeight:500,marginBottom:8,fontStyle:"italic"}}>{"At midday you felt "+Mo[mm].l.toLowerCase()+". Has that shifted?"}</p>}<p style={{fontSize:17,color:c.t,fontWeight:500,marginBottom:14}}>How did you feel today, overall?</p><MR v={mood} set={setMood}/></div>

<div style={{background:c.g,borderRadius:18,padding:"20px 20px 16px",marginBottom:12}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:12}}>Grateful For</p>{[1,2].map(n=><div key={n} style={{display:"flex",gap:10,marginBottom:10}}><span style={{fontFamily:"'Merriweather',serif",fontSize:22,fontWeight:400,color:c.a}}>{n+"."}</span><input style={{flex:1,fontFamily:"'DM Sans'",fontSize:15,color:c.t,background:"transparent",border:"none",borderBottom:`2px solid ${c.b}`,padding:"4px 0 6px"}} placeholder={n===1?"Something that brought light today...":"Something quiet you're thankful for..."}/></div>)}</div>

<div style={{background:"#fff",borderRadius:18,padding:"22px 20px 18px",marginBottom:12,boxShadow:`0 4px 16px ${c.b}40`}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:8}}>Evening Reflection</p><p style={{fontSize:17,color:c.t,lineHeight:1.5,fontWeight:500,marginBottom:16}}>What was the best part of your day, and why?</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:"transparent",border:"none",borderBottom:`2px solid ${c.b}`,padding:"8px 0 10px",resize:"none",lineHeight:1.6}} placeholder="Even small moments count..." rows={3}/><div style={{background:c.g,borderRadius:12,padding:"14px 16px",border:`1.5px solid ${c.b}`,marginTop:16}}><p style={{fontSize:12,fontWeight:600,color:c.a,marginBottom:4}}>↩ Back to this morning</p><p style={{fontSize:15,color:c.t,lineHeight:1.5}}>You set an intention earlier. Did it play out? What shifted?</p></div></div>

<div style={{background:c.g,borderRadius:18,padding:"20px 18px",marginBottom:12}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:12}}>Daily Habits</p>{c.hb.map((h,i)=><div key={i} onClick={()=>{const n=[...hab];n[i]=!n[i];setHab(n);}} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:"#fff",borderRadius:12,marginBottom:8,cursor:"pointer",border:hab[i]?`2px solid ${c.a}`:`1.5px solid ${c.b}`}}><div style={{width:22,height:22,borderRadius:7,border:`2px solid ${hab[i]?c.a:c.b}`,background:hab[i]?c.a:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{hab[i]&&<span style={{color:"#fff",fontSize:12}}>✓</span>}</div><span style={{fontSize:14,fontWeight:hab[i]?600:500,color:hab[i]?c.t:`${c.t}AA`}}>{h}</span></div>)}</div>

{/* Free-form space */}
<div style={{background:"#fff",borderRadius:18,padding:"22px 20px 18px",marginBottom:12,border:`1.5px solid ${c.b}`}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:4}}>Evening Pages</p><p style={{fontSize:15,color:c.t,opacity:0.75,marginBottom:14}}>Anything else on your mind? This is your blank page — write whatever needs to come out.</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:"transparent",border:"none",borderBottom:`2px solid ${c.b}`,padding:"8px 0 10px",resize:"none",lineHeight:1.6}} placeholder="No rules here..." rows={4}/></div>

<div style={{background:c.h,borderRadius:20,padding:"30px 24px",textAlign:"center",marginBottom:12,position:"relative",overflow:"hidden"}}><div style={{position:"absolute",inset:0,background:"radial-gradient(circle at 70% 30%,rgba(255,255,255,0.12),transparent 50%)"}}/><p style={{fontSize:12,letterSpacing:4,color:"#fff",fontWeight:700,marginBottom:14,position:"relative"}}>CARRY THIS WITH YOU</p><p style={{fontFamily:"'Merriweather',serif",fontSize:20,fontWeight:400,fontStyle:"italic",color:"#fff",lineHeight:1.55,position:"relative"}}>{c.tk}</p></div>

{/* End-of-day emoji reaction */}
<div style={{background:c.g,borderRadius:18,padding:"20px 16px",marginBottom:12,textAlign:"center"}}><p style={{fontSize:15,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:4}}>Today In One Emoji</p><p style={{fontSize:15,color:c.t,opacity:0.75,marginBottom:14}}>No words needed. Just tap how today felt.</p><div style={{display:"flex",justifyContent:"center",gap:10}}>{[{e:"😌",l:"Peaceful"},{e:"🔥",l:"On fire"},{e:"💭",l:"Thoughtful"},{e:"🌊",l:"Flowing"},{e:"🌱",l:"Growing"},{e:"😤",l:"Tough"}].map((x,i)=><div key={i} onClick={()=>setDayEmoji(i)} style={{textAlign:"center",padding:"10px 6px",borderRadius:12,cursor:"pointer",background:dayEmoji===i?`${c.a}15`:"transparent",border:dayEmoji===i?`2px solid ${c.a}`:"2px solid transparent",transition:"all 0.2s",width:52}}><span style={{fontSize:28}}>{x.e}</span><p style={{fontSize:9,color:dayEmoji===i?c.a:c.t,fontWeight:dayEmoji===i?700:500,marginTop:4,opacity:dayEmoji===i?1:0.5}}>{x.l}</p></div>)}</div></div>

{/* Weekly Pulse - shows on day 7 */}
{c.d===7&&<div style={{background:"#fff",borderRadius:18,padding:"22px 20px",marginBottom:12,border:`2px solid ${c.a}`,boxShadow:`0 4px 20px ${c.a}20`}}><div style={{textAlign:"center",marginBottom:16}}><p style={{fontSize:13,letterSpacing:3,fontWeight:700,color:c.a,textTransform:"uppercase",marginBottom:4}}>Weekly Pulse</p><p style={{fontFamily:"'Merriweather',serif",fontSize:20,fontWeight:700,color:c.t}}>Week 1 Check-In</p><p style={{fontSize:14,color:c.t,opacity:0.6,marginTop:4}}>You've been at this for 7 days. Let's take a wider look.</p></div><div style={{marginBottom:14}}><p style={{fontSize:15,color:c.t,fontWeight:600,marginBottom:8}}>What's one pattern you've noticed this week?</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:c.g,border:"none",borderRadius:12,padding:"12px 14px",resize:"none",lineHeight:1.6}} placeholder="Maybe something about your sleep, your mood, your energy..." rows={3}/></div><div style={{marginBottom:14}}><p style={{fontSize:15,color:c.t,fontWeight:600,marginBottom:8}}>What's been the hardest part so far?</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:c.g,border:"none",borderRadius:12,padding:"12px 14px",resize:"none",lineHeight:1.6}} placeholder="Be honest with yourself..." rows={2}/></div><div><p style={{fontSize:15,color:c.t,fontWeight:600,marginBottom:8}}>What do you want to focus on next week?</p><textarea style={{width:"100%",fontFamily:"'DM Sans'",fontSize:16,color:c.t,background:c.g,border:"none",borderRadius:12,padding:"12px 14px",resize:"none",lineHeight:1.6}} placeholder="One thing is enough..." rows={2}/></div></div>}

<div style={{background:"#fff",borderRadius:18,padding:"24px 20px",marginBottom:16,border:`1.5px solid ${c.b}`,textAlign:"center"}}>{dayClosed?(<div><p style={{fontSize:36,marginBottom:8}}>✓</p><p style={{fontFamily:"'Merriweather',serif",fontSize:18,fontWeight:700,color:c.t,marginBottom:4}}>{"Day "+c.d+" — done."}</p><p style={{fontSize:15,color:c.t,opacity:0.75,marginBottom:16}}>Every entry adds to your story.</p><p onClick={()=>setDayClosed(false)} style={{fontSize:13,color:c.a,cursor:"pointer",fontWeight:500,marginBottom:16}}>Need to edit? Tap here to reopen.</p><div style={{borderTop:`1.5px solid ${c.b}`,paddingTop:16}}><p style={{fontSize:11,letterSpacing:2,fontWeight:600,color:c.a,textTransform:"uppercase",marginBottom:6}}>Tomorrow</p><p style={{fontFamily:"'Merriweather',serif",fontSize:20,fontWeight:400,fontStyle:"italic",color:c.t}}>{C[(ci+1)%6].n+" "+C[(ci+1)%6].i}</p><p style={{fontSize:14,color:c.t,opacity:0.65,marginTop:4}}>Something different. Something worth thinking about.</p></div></div>):(<div><p style={{fontFamily:"'Merriweather',serif",fontSize:20,fontWeight:700,color:c.t,marginBottom:6}}>Ready to close today?</p><p style={{fontSize:15,color:c.t,opacity:0.75,marginBottom:16}}>{dayEmoji===null?"Select your emoji above, then close your entry.":"You can always come back to edit."}</p><button onClick={()=>setDayClosed(true)} style={{padding:"14px 32px",borderRadius:12,border:"none",background:dayEmoji!==null?c.h:`${c.b}`,color:dayEmoji!==null?"#fff":c.t,fontSize:15,fontWeight:700,fontFamily:"'DM Sans',sans-serif",letterSpacing:1,cursor:"pointer",opacity:dayEmoji===null?0.5:1,position:"relative",overflow:"hidden"}}><span style={{position:"relative"}}>Close Today's Entry</span></button></div>)}</div>

<div style={{textAlign:"center"}}><button style={{fontFamily:"'DM Sans'",fontSize:12,letterSpacing:3,textTransform:"uppercase",padding:"14px 28px",background:c.a,color:"#fff",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer"}}>Share Today's Quote</button></div>
<div style={{textAlign:"center",marginTop:32}}><div style={{width:40,height:1,background:c.b,margin:"0 auto 10px"}}/><p style={{fontSize:11,letterSpacing:2,color:`${c.a}80`}}>worthyest.com</p></div>
</div>
</div>)}
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
